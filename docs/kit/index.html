<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Redd Marine — Private Preview</title>
<meta name="theme-color" content="#141414">
<link rel="icon" href="/assets/icons/favicon.ico" sizes="any">
<link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#141414;
    --red:#EF3513;
    --cream:#FFF8E1;
    --cream-dim:rgba(255,248,225,.58);
    --line:rgba(255,248,225,.14);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--ink);
    color:var(--cream);
    font-family:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;
    min-height:100dvh;padding:32px;position:relative;overflow:hidden;
  }
  body::before{
    content:"";position:absolute;top:50%;left:50%;
    width:900px;height:900px;transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(239,50,45,.16), transparent 60%);
    pointer-events:none;
  }
  main{position:relative;max-width:430px;width:100%;text-align:center}
  .emblem{width:min(150px,42vw);margin:0 auto 30px;display:block}
  .badge{
    display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.28em;
    text-transform:uppercase;color:var(--red);
    border:1px solid var(--line);border-radius:8px;padding:8px 15px;
  }
  h1{
    font-size:clamp(21px,3.4vw,27px);font-weight:800;letter-spacing:-.01em;
    line-height:1.3;margin:20px auto 12px;max-width:20ch;
  }
  p.sub{
    color:var(--cream-dim);font-size:14px;font-weight:500;line-height:1.65;
    max-width:38ch;margin:0 auto 30px;
  }

  form{display:flex;flex-direction:column;gap:12px;text-align:left}
  label{
    font-size:10.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
    color:var(--cream-dim);
  }
  input{
    font:inherit;font-size:16px;font-weight:600;letter-spacing:.02em;
    width:100%;padding:15px 17px;
    color:var(--cream);background:rgba(255,248,225,.06);
    border:1px solid var(--line);border-radius:11px;
    transition:border-color .16s,background .16s;
  }
  input::placeholder{color:rgba(255,248,225,.26);font-weight:500;letter-spacing:0}
  input:focus{outline:none;border-color:var(--red);background:rgba(255,248,225,.1)}
  button{
    font:inherit;font-size:14px;font-weight:700;letter-spacing:.04em;
    padding:15px 20px;border:0;border-radius:11px;cursor:pointer;
    background:var(--red);color:#fff;
    transition:filter .16s,opacity .16s;
  }
  button:hover:not(:disabled){filter:brightness(1.1)}
  button:disabled{opacity:.55;cursor:default}

  .msg{
    min-height:19px;font-size:12.5px;font-weight:600;line-height:1.5;
    text-align:center;letter-spacing:.01em;
  }
  .msg.err{color:#FF7A63}
  .msg.busy{color:var(--cream-dim)}

  footer{
    margin-top:38px;font-size:10.5px;font-weight:600;letter-spacing:.12em;
    text-transform:uppercase;color:var(--cream-dim);opacity:.62;line-height:1.9;
  }
  footer a{color:inherit}

  /* the spinner doubles as honest feedback: unwrapping really does take a moment */
  .dots::after{content:'';animation:dots 1.2s steps(4,end) infinite}
  @keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
  @media (prefers-reduced-motion:reduce){.dots::after{content:'...';animation:none}}
</style>
</head>
<body>
<main>
  <img class="emblem" src="/assets/img/redd-marine-emblem.png" alt="Redd Marine">

  <span class="badge">Private Preview</span>
  <h1>Builder interview kit</h1>
  <p class="sub">A working concept walkthrough, shared by invitation while Redd Marine is in development. Not a product announcement.</p>

  <form id="gate" autocomplete="off">
    <label for="pw">Access password</label>
    <input id="pw" type="password" inputmode="text" autocapitalize="none"
           autocorrect="off" spellcheck="false" placeholder="xxxx-xxxx-xxxx"
           autocomplete="current-password">
    <button id="go" type="submit">Open the kit</button>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
  </form>

  <footer>
    Redd Marine &middot; Wrightsville Beach, NC<br>
    Concept prototype &middot; simulated data
  </footer>
</main>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════
   The kit itself is AES-GCM ciphertext (payload.enc) under a random content
   key. That content key is stored only as a set of copies, each wrapped
   under one password via PBKDF2-SHA256. Getting in means unwrapping the
   content key with your password, then decrypting the payload — all in this
   browser. The server never holds the plaintext and never sees the password.
   ═══════════════════════════════════════════════════════════════════════ */

const pw   = document.getElementById('pw');
const go   = document.getElementById('go');
const msg  = document.getElementById('msg');
const form = document.getElementById('gate');

const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

function say(text, cls){
  msg.className = 'msg' + (cls ? ' ' + cls : '');
  msg.innerHTML = '';
  msg.append(document.createTextNode(text));
  if(cls === 'busy'){
    const d = document.createElement('span');
    d.className = 'dots';
    msg.append(d);
  }
}

async function deriveWrappingKey(password, salt, kdf){
  const base = await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']
  );
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt, iterations:kdf.iterations, hash:kdf.hash },
    base,
    { name:'AES-GCM', length:kdf.keyLength || 256 },
    false,
    ['decrypt']
  );
}

/* Try one wrapped copy of the content key. A wrong password fails the GCM
   auth tag, which throws — that throw IS the "wrong password" answer. */
async function tryEntry(password, entry, kdf){
  try{
    const wrappingKey = await deriveWrappingKey(password, unb64(entry.salt), kdf);
    return new Uint8Array(await crypto.subtle.decrypt(
      { name:'AES-GCM', iv: unb64(entry.iv) }, wrappingKey, unb64(entry.key)
    ));
  }catch(_){ return null; }
}

async function open(password){
  const access = await (await fetch('access.json', {cache:'no-store'})).json();

  // The admin phrase opens the kit too — it wraps the same content key.
  const candidates = access.entries.concat(access.admin ? [access.admin] : []);
  let rawKey = null;
  for(const entry of candidates){
    rawKey = await tryEntry(password, entry, access.kdf);
    if(rawKey) break;
  }
  if(!rawKey) return null;

  const blob = new Uint8Array(await (await fetch(access.payload, {cache:'no-store'})).arrayBuffer());
  const contentKey = await crypto.subtle.importKey('raw', rawKey, 'AES-GCM', false, ['decrypt']);
  const html = await crypto.subtle.decrypt(
    { name:'AES-GCM', iv: blob.slice(0, 12) }, contentKey, blob.slice(12)
  );
  return new TextDecoder().decode(html);
}

form.addEventListener('submit', async e => {
  e.preventDefault();
  const password = pw.value.trim();
  if(!password) return;

  go.disabled = true;
  pw.disabled = true;
  say('Unlocking', 'busy');

  try{
    // let the browser paint the busy state before PBKDF2 takes the thread
    await new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));
    const html = await open(password);

    if(!html){
      say('That password does not open this kit.', 'err');
      go.disabled = false;
      pw.disabled = false;
      pw.select();
      return;
    }

    // Hand the whole tab over to the kit: full screen, real keyboard focus,
    // and "Add to Home Screen" on an iPad behaves the way it should.
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    say('Could not load the kit. Check your connection and try again.', 'err');
    go.disabled = false;
    pw.disabled = false;
  }
});

pw.addEventListener('input', () => { if(msg.className !== 'msg') say(''); });
pw.focus();
</script>
</body>
</html>
