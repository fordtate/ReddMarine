<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Redd Marine — Coming Soon</title>
<meta name="description" content="Redd Marine builds smart-dock safety technology — shock protection, lighting, and security for the modern residential dock. Coming soon.">
<meta name="theme-color" content="#ef3513">

<link rel="icon" href="/assets/icons/favicon.ico" sizes="any">
<link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon-180.png">
<link rel="manifest" href="/site.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#141414;
    --red:#EF3513;
    --cream:#FFF8E1;
    --cream-dim:rgba(255,248,225,.58);
    --line:rgba(255,248,225,.14);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--ink);
    color:var(--cream);
    font-family:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:32px;
    position:relative;
    overflow:hidden;
  }
  body::before{
    content:"";
    position:absolute;
    top:50%;
    left:50%;
    width:900px;
    height:900px;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(239,50,45,.16), transparent 60%);
    pointer-events:none;
  }
  main{
    position:relative;
    max-width:640px;
    width:100%;
    text-align:center;
  }
  .emblem{
    width:min(220px, 60vw);
    margin:0 auto 40px;
    display:block;
  }
  .badge{
    display:inline-block;
    font-family:'Montserrat',sans-serif;
    font-size:11px;
    font-weight:700;
    letter-spacing:.28em;
    text-transform:uppercase;
    color:var(--red);
    border:1px solid var(--line);
    border-radius:8px;
    padding:8px 16px;
  }
  h1{
    font-size:clamp(24px,4vw,36px);
    font-weight:800;
    letter-spacing:-.01em;
    line-height:1.25;
    max-width:24ch;
    margin:22px auto 14px;
  }
  p.sub{
    color:var(--cream-dim);
    font-size:16px;
    font-weight:500;
    line-height:1.6;
    max-width:46ch;
    margin:0 auto;
  }
  footer{
    margin-top:64px;
    font-family:'Montserrat',sans-serif;
    font-size:11px;
    font-weight:600;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--cream-dim);
    opacity:.7;
  }
</style>
</head>
<body>
<main>
  <img class="emblem" src="/assets/img/redd-marine-emblem.png" alt="Redd Marine">

  <span class="badge">Coming Soon</span>
  <h1>Dock safety technology, reimagined.</h1>
  <p class="sub">Shock protection, lighting, and security built for the residential dock. Redd Marine is in development — the full site launches soon.</p>

  <footer>&copy; 2026 Redd Marine &middot; Wilmington, NC</footer>
</main>
</body>
</html>
